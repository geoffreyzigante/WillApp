<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
@font-face{font-family:'AV Estiana';src:url('AVEstiana.woff2') format('woff2');font-weight:700;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}

.fg{position:relative;width:1024px;height:500px;overflow:hidden;
  background:linear-gradient(118deg,#8A45FF 0%,#7B2FFF 34%,#5E1AD6 68%,#3F0D9E 100%)}
.fg::before{content:"";position:absolute;inset:0;
  background:radial-gradient(58% 92% at 86% 6%,rgba(244,166,255,.42),transparent 62%)}
.fg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(44% 70% at 6% 96%,rgba(0,0,0,.22),transparent 60%)}

/* texte : cale dans la moitie gauche, loin des bords (Play rogne les cotes) */
.txt{position:absolute;z-index:3;left:76px;top:50%;transform:translateY(-50%);width:505px}
.mot{font:700 118px/1 'AV Estiana','Montserrat';color:#fff;letter-spacing:-.015em}
.acc{margin-top:22px;font:700 39px/1.17 'Montserrat';letter-spacing:-.025em;color:#fff}
.acc em{font-style:normal;color:#F4A6FF}
.sous{margin-top:17px;font:500 23px/1.35 'Montserrat';color:rgba(255,255,255,.76)}

/* photos : une seule figure visuelle, en eventail sur la droite */
.pile{position:absolute;z-index:2;right:16px;top:50%;transform:translateY(-50%);
  width:430px;height:500px}
.pc{position:absolute;border-radius:26px;overflow:hidden;background:#2a1550;
  box-shadow:0 34px 64px -18px rgba(14,2,44,.6), 0 0 0 7px rgba(255,255,255,.95)}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.p1{width:210px;height:265px;left:0px;  top:124px;transform:rotate(-8deg)}
.p2{width:224px;height:283px;left:110px;top:100px;transform:rotate(3.5deg);z-index:2}
.p3{width:200px;height:252px;left:216px;top:140px;transform:rotate(12deg)}
</style></head><body>

<div class="fg">
  <div class="txt">
    <div class="mot">will</div>
    <div class="acc">Tes photos de course,<br><em>sans les chercher</em></div>
    <div class="sous">Un selfie une fois. Elles te retrouvent toutes seules.</div>
  </div>
  <div class="pile">
    <div class="pc p1"><img src="g3.jpg"></div>
    <div class="pc p2"><img src="g6.jpg"></div>
    <div class="pc p3"><img src="g5.jpg"></div>
  </div>
</div>

</body></html>
